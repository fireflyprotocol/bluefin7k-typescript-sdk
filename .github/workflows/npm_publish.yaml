name: NPM Release

on:
  push:
    tags:
      - bluefin7k-sdk-release-*
  workflow_dispatch:
    inputs:
      dist_tag:
        description: "npm dist-tag to publish under"
        required: true
        default: next
        type: choice
        options:
          - next
          - latest

permissions:
  id-token: write
  contents: read

concurrency:
  group: npm-publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish-ts:
    runs-on: ubuntu-latest
    environment: sui-prod
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Enable Corepack
        run: corepack enable

      - name: Upgrade npm for OIDC support
        run: npm install -g npm@latest

      - name: Verify dispatched commit is on main
        if: github.event_name == 'workflow_dispatch'
        run: |
          COMMIT_SHA=$(git rev-parse HEAD)
          if ! git branch -r --contains "$COMMIT_SHA" | grep -q "origin/main"; then
            echo "::error::Dispatched commit $COMMIT_SHA is not reachable from origin/main. Publish only from merged code."
            exit 1
          fi
          echo "Commit $COMMIT_SHA is reachable from origin/main"

      - name: Resolve dist-tag + guard version
        run: |
          PKG_NAME="$(node -p "require('./package.json').name")"
          PKG_VERSION="$(node -p "require('./package.json').version")"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            DIST_TAG="${{ inputs.dist_tag }}"
            if [[ "$DIST_TAG" == "next" ]]; then
              PKG_VERSION="${PKG_VERSION}-next.g${GITHUB_SHA:0:7}"
              npm pkg set version="$PKG_VERSION"
            fi
          else
            DIST_TAG=latest
            TAG_VERSION="${GITHUB_REF_NAME#bluefin7k-sdk-release-}"
            if [[ "$TAG_VERSION" != "$PKG_VERSION" ]]; then
              echo "::error::Tag version '$TAG_VERSION' != package.json version '$PKG_VERSION' — bump package.json to match the tag."
              exit 1
            fi
          fi

          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "::error::$PKG_NAME@$PKG_VERSION is already published — bump the version (npm versions are immutable)."
            exit 1
          fi

          echo "DIST_TAG=$DIST_TAG" >> "$GITHUB_ENV"
          echo "Publishing $PKG_NAME@$PKG_VERSION (dist-tag: $DIST_TAG)"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn run build

      - name: Publish to NPM
        run: npm publish --tag "$DIST_TAG"
